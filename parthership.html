<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الشراكات والرعاية - الاتفاق الرباطي</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="content">

<h1>طلب شراكة أو رعاية</h1>

<p>
يسعد نادي الاتفاق الرباطي بالتعاون مع المؤسسات والشركات الراغبة في دعم المشروع الرياضي.
</p>

<form>

<label>اسم الشركة أو المؤسسة</label>
<input type="text" placeholder="اسم الشركة">

<label>اسم الشخص المسؤول</label>
<input type="text" placeholder="اسم المسؤول">

<label>رقم الاتصال</label>
<input type="tel" placeholder="+212">

<label>البريد الإلكتروني</label>
<input type="email" placeholder="Email">

<label>نوع الشراكة المطلوبة</label>
<select>
<option>رعاية رياضية</option>
<option>شراكة إعلامية</option>
<option>دعم لوجستي</option>
<option>شراكة أخرى</option>
</select>

<label>ملاحظات إضافية</label>
<textarea placeholder="اكتب تفاصيل الطلب"></textarea>

<button type="button">
إرسال طلب الشراكة
</button>

</form>

</div>

</body>
</html>
