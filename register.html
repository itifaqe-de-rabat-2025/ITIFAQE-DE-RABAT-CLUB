<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل في النادي - الاتفاق الرباطي</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="content">

<h1>التسجيل في نادي الاتفاق الرباطي</h1>

<p>
املأ المعلومات التالية، وسيتم إرسال الطلب إلى إدارة النادي للمراجعة والاتصال بك.
</p>

<form>

<label>اسم اللاعب</label>
<input type="text" placeholder="اكتب اسم اللاعب">

<label>تاريخ الازدياد</label>
<input type="date">

<label>مركز اللاعب في الملعب</label>
<input type="text" placeholder="مثال: مدافع - وسط - مهاجم - حارس">

<label>الفئة العمرية</label>
<input type="text" placeholder="مثال: 2015">

<label>مكان السكن</label>
<select>
<option>الرباط</option>
<option>مقاطعة أخرى داخل الرباط</option>
</select>

<label>رقم هاتف ولي الأمر</label>
<input type="tel" placeholder="+212">

<label>البريد الإلكتروني</label>
<input type="email">

<label>ملاحظات إضافية</label>
<textarea placeholder="أي معلومات إضافية"></textarea>

<button type="button">
إرسال طلب التسجيل
</button>

</form>

</div>

</body>
</html>
