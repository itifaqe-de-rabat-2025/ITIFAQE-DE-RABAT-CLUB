<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل لاعب | الاتفاق الرباطي</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

<div class="logo-area">

<img src="logo.jpeg">

<h1>
تسجيل لاعب جديد
</h1>

</div>


<a href="index.html" class="login-btn">
الرئيسية
</a>

</header>




<section class="content">


<h2>
استمارة الانضمام إلى النادي
</h2>


<p>
يرجى ملء جميع المعلومات بدقة.
</p>




<form id="player-register-form">



<h3>
معلومات اللاعب
</h3>


<label>
الاسم الكامل
</label>

<input type="text" placeholder="أدخل اسم اللاعب" required>



<label>
تاريخ الازدياد
</label>

<input type="date" required>



<label>
مكان الازدياد
</label>

<input type="text" placeholder="مكان الازدياد">



<label>
الفئة العمرية
</label>

<select>

<option>
أقل من 11 سنة
</option>

<option>
أقل من 13 سنة
</option>

<option>
أقل من 15 سنة
</option>

<option>
أقل من 17 سنة
</option>

<option>
أقل من 19 سنة
</option>

</select>




<label>
المركز في الملعب
</label>

<select>

<option>
حارس مرمى
</option>

<option>
مدافع
</option>

<option>
وسط ميدان
</option>

<option>
مهاجم
</option>

</select>





<label>
الطول
</label>

<input type="text" placeholder="مثال: 178 cm">



<label>
الوزن
</label>

<input type="text" placeholder="مثال: 65 kg">



<label>
القدم المفضلة
</label>

<select>

<option>
اليمنى
</option>

<option>
اليسرى
</option>

<option>
كلتا القدمين
</option>

</select>





<h3>
معلومات ولي الأمر
</h3>



<label>
اسم ولي الأمر
</label>

<input type="text" placeholder="الاسم الكامل">



<label>
رقم الهاتف
</label>

<input type="tel" placeholder="06xxxxxxxx">



<label>
البريد الإلكتروني
</label>

<input type="email" placeholder="example@email.com">





<h3>
معلومات إضافية
</h3>


<label>
رفع صورة اللاعب
</label>

<input type="file" accept="image/*">



<label>
ملاحظات
</label>

<textarea placeholder="أي معلومات إضافية عن اللاعب"></textarea>



<button type="submit">
إرسال طلب التسجيل
</button>



</form>




<div id="success-message" style="display:none;">

<h3>
✅ تم إرسال طلبك بنجاح
</h3>

<p>
سيتم مراجعة الطلب من إدارة النادي.
</p>

</div>



</section>




<footer>

<p>
الاتفاق الرباطي © 2026
</p>

</footer>




<script src="script.js"></script>


<script>

document.getElementById("player-register-form")
.addEventListener("submit",function(e){

e.preventDefault();


document.getElementById("success-message")
.style.display="block";


this.reset();


});

</script>



</body>

</html>
