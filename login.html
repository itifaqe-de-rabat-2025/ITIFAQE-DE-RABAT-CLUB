<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول الأعضاء | الاتفاق الرباطي</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-page">


<!-- الشعار في اليمين -->

<div class="login-logo">

<img src="logo.jpeg" alt="الاتفاق الرباطي">

<h1>
الاتفاق الرباطي
</h1>

<p>
ITIFAQE DE RABAT CLUB
</p>

</div>




<!-- تسجيل الدخول في اليسار -->

<div class="login-box">


<h2 id="login-title">
تسجيل الدخول
</h2>



<form>


<input 
type="email"
id="email"
placeholder="البريد الإلكتروني"
>



<input
type="password"
id="password"
placeholder="كلمة المرور"
>



<button type="button" onclick="login()">

دخول

</button>



</form>



<p id="message"></p>



<div>

<button onclick="setLanguage('ar')">
العربية
</button>


<button onclick="setLanguage('en')">
English
</button>

</div>


</div>



</div>



<script src="script.js"></script>


</body>

</html>
